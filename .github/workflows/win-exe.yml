name: win-exe
on:
  push:
    branches: [win-exe]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Install Skia
      shell: bash
      run: |
        skia_url=$(source laf/misc/skia-url.sh | xargs)
        curl --ssl-revoke-best-effort -L -o skia.zip "$skia_url"
        unzip -q skia.zip -d skia
    - uses: aseprite/get-ninja@main
    - uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_TESTS=OFF \
          -DENABLE_SCRIPTING=ON \
          -DENABLE_CCACHE=OFF \
          -DENABLE_OPENSSL=OFF \
          -DLAF_BACKEND=skia \
          -DSKIA_DIR=$(realpath skia) \
          -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-x64)
    - name: Compile
      shell: bash
      run: cd build && ninja aseprite
    - name: Package portable
      shell: bash
      run: |
        mkdir aseprite-portable
        cp build/bin/aseprite.exe aseprite-portable/
        cp -r build/bin/data aseprite-portable/
        touch aseprite-portable/aseprite.ini
    - uses: actions/upload-artifact@v4
      with:
        name: aseprite-windows-x64-portable
        path: aseprite-portable
